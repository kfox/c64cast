name: Release

# Triggered by a `v*` tag on main. See RELEASING.md.
#
# `workflow_dispatch` with `publish` off builds and verifies without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish (PyPI + GitHub release). Leave off for a dry run."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build + verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(uv run --no-project python -c \
              'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if printf '%s' "$version" | grep -Eq '(a|b|rc)[0-9]+$|\.dev[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "releasing $version"

      - name: Check the tree is consistent with the tag
        run: uv run --no-project python scripts/bump_version.py --check "${{ steps.version.outputs.version }}"

      # No OS matrix: the wheel is py3-none-any, so one runner produces the
      # artifact every platform installs. Platform coverage is ci.yml's job.
      - name: Build sdist + wheel
        run: uv build

      - name: Check the built metadata
        run: uvx twine check --strict dist/*

      # Run from outside the checkout, where an `import c64cast` cannot reach
      # the source tree.
      - name: Smoke-test the wheel
        run: |
          set -euo pipefail
          wheel="$PWD/$(ls dist/*.whl)"
          expected="${{ steps.version.outputs.version }}"
          cd "$RUNNER_TEMP"

          got="$(uv run --no-project --with "$wheel" c64cast --version)"
          echo "c64cast --version -> $got"
          [ "$got" = "c64cast $expected" ] || {
            echo "::error::wheel reports '$got', expected 'c64cast $expected'"
            exit 1
          }

          uv run --no-project --with "$wheel" c64cast --list-examples > /dev/null
          uv run --no-project --with "$wheel" c64cast --print-example hello > /dev/null
          uv run --no-project --with "$wheel" python -c "
          from c64cast import paths
          schema = paths.packaged_schema_path()
          assert schema.is_file(), f'schema missing from the wheel: {schema}'
          names = paths.example_config_paths()
          assert len(names) > 30, f'only {len(names)} example configs shipped'
          print(f'packaged: {schema.name} + {len(names)} examples')
          "

      - name: Set up Typst
        uses: typst-community/setup-typst@63ac138db421d586de61f7f5ac3bcef6a2e6c78c # v5.1.0

      - name: Render the User's Guide
        # build_guide.py is stdlib-only, so PY skips the project sync.
        run: make guide PY="uv run --no-project python"

      - name: Name the guide for release
        run: |
          set -euo pipefail
          cp docs/guide/c64cast-users-guide.pdf \
            "dist/c64cast-users-guide-${{ steps.version.outputs.version }}.pdf"
          ls -l dist/

      - name: Extract the changelog section for this version
        run: |
          uv run --no-project python scripts/bump_version.py \
            --notes "${{ steps.version.outputs.version }}" > release-notes.md
          cat release-notes.md

      - name: Upload the release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  # Before github-release: a PyPI version can only be yanked, never replaced,
  # while a GitHub release can be deleted and recreated.
  publish-pypi:
    name: publish to PyPI
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/c64cast/${{ needs.build.outputs.version }}
    permissions:
      id-token: write
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"

      - name: Download the built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      - name: Keep only the distributions
        run: |
          set -euo pipefail
          rm -f dist/*.pdf release-notes.md
          ls -l dist/

      # The PyPA publish action is not an option here: it is a Docker action
      # that resolves its image by the action ref, so it cannot be digest-pinned
      # the way every action in this repo is. uv does the same OIDC upload, with
      # attestations, and no container.
      #
      # `always`, not `automatic`: automatic falls back to looking for a token.
      - name: Publish
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple/c64cast/ \
            dist/*

  github-release:
    name: create the GitHub release
    needs: [build, publish-pypi]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      # Assets are behind a collapsed control, so the notes link them directly.
      # A `releases/latest/download/…` URL cannot serve these — the filenames
      # carry the version.
      - name: Compose the release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          {
            echo "### Downloads"
            echo
            echo "* 📘 **[c64cast User's Guide $VERSION (PDF)]($base/c64cast-users-guide-$VERSION.pdf)**"
            echo "  — 10 chapters, read in order, starting from nothing."
            echo "* 📦 [\`c64cast-$VERSION-py3-none-any.whl\`]($base/c64cast-$VERSION-py3-none-any.whl)"
            echo "  · [\`c64cast-$VERSION.tar.gz\`]($base/c64cast-$VERSION.tar.gz)"
            echo "  — or just \`uv tool install 'c64cast[all]'\`"
            echo "  ([PyPI](https://pypi.org/project/c64cast/$VERSION/))."
            echo
            echo "---"
            echo
            cat release-notes.md
          } > body.md
          cat body.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "c64cast v$VERSION" \
            --notes-file body.md \
            "${flags[@]}" \
            dist/*.whl \
            dist/*.tar.gz \
            "dist/c64cast-users-guide-$VERSION.pdf"
