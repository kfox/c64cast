name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Main runs are never cancelled, and get a group per SHA rather than per ref:
# under a shared group the next merge's run replaces a queued one, so that
# commit would get no CI result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: pre-commit (lint + format + hygiene)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run --locked pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: pyright,unittest

  docs:
    name: docs (books + site render)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Every book parses as Typst
        run: |
          for book in docs/*/book.toml; do
            uv run --no-project python scripts/build_book.py \
              --book-dir "$(dirname "$book")" --check
          done
      - name: The whole site renders
        run: make site-check PY="uv run --no-project python"
      - name: The search box's ranking/highlighting logic
        run: node --test docs/shared/search.test.mjs

  web:
    name: web console (bundle matches its sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rebuild the console
        run: make web
      - name: The committed bundle is current
        run: make web-check

  types:
    name: types (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            pyright: Linux
            mypy: linux
          - name: macOS
            pyright: Darwin
            mypy: darwin
          - name: Windows
            pyright: Windows
            mypy: win32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install runtime + dev deps
        run: uv sync --frozen --no-default-groups --group dev --extra web --extra video
      - name: Pyright (basic, whole tree)
        run: uv run pyright --pythonplatform ${{ matrix.pyright }}
      - name: Mypy --strict (hot modules)
        run: uv run mypy --strict --platform ${{ matrix.mypy }}

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install runtime + dev deps
        # `web` and `video` are not optional: without them the
        # @skipUnless(HAVE_TESTCLIENT) and PyAV suites skip -- hundreds of
        # tests -- and the HTTP surface and the video decoder stop being
        # exercised.
        run: uv sync --frozen --no-default-groups --group dev --extra web --extra video

      - name: Warm node (timed)
        # The first node launch on a fresh Windows runner has outlasted the
        # suite's 20 s child bound (#616). Paying for it here keeps it out from
        # under that bound, and `time` puts its cost in the log. `--version`
        # would not do: node answers it before starting V8, so the cost the
        # test's `node -e` pays would still land under the bound.
        shell: bash
        timeout-minutes: 5
        run: time node -e ""

      - name: Unit tests
        env:
          PYTHONPATH: tests
        run: uv run python -m unittest_parallel -s tests -b

  coverage:
    name: coverage (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dev deps
        # `web` and `video` for the same reason as the test legs: a skipped
        # suite reads as uncovered and tanks the codecov patch/project gates.
        run: uv sync --frozen --no-default-groups --group dev --extra web --extra video

      - name: Coverage
        run: uv run make coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.14' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: ./test-results/*.xml
          use_oidc: true

  ci:
    name: ci (all jobs succeeded)
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pre-commit, docs, web, types, test, coverage]
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
