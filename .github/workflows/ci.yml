name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (lint + format + hygiene)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run --locked pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: pyright,unittest

  docs:
    name: docs (books + site render)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Every book parses as Typst
        run: |
          for book in docs/*/book.toml; do
            uv run --no-project python scripts/build_book.py \
              --book-dir "$(dirname "$book")" --check
          done
      - name: The whole site renders
        run: make site-check PY="uv run --no-project python"
      - name: The search box's ranking/highlighting logic
        run: node --test docs/shared/search.test.mjs

  web:
    name: web console (bundle matches its sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rebuild the console
        run: make web
      - name: The committed bundle is current
        run: git diff --exit-code -- c64cast/web/dist

  types:
    name: types (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            pyright: Linux
            mypy: linux
          - name: macOS
            pyright: Darwin
            mypy: darwin
          - name: Windows
            pyright: Windows
            mypy: win32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install runtime + dev deps
        run: uv sync --frozen --no-default-groups --group dev --extra web
      - name: Pyright (basic, whole tree)
        run: uv run pyright --pythonplatform ${{ matrix.pyright }}
      - name: Mypy --strict (hot modules)
        run: uv run mypy --strict --platform ${{ matrix.mypy }}

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install runtime + dev deps
        # `web` is not optional: without it the @skipUnless(HAVE_TESTCLIENT)
        # suites skip -- hundreds of tests -- and the HTTP surface stops being
        # exercised.
        run: uv sync --frozen --no-default-groups --group dev --extra web

      - name: Unit tests
        env:
          PYTHONPATH: tests
        run: uv run python -m unittest_parallel -s tests -b

  coverage:
    name: coverage (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: test
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dev deps
        # `web` for the same reason as the test legs: a skipped HTTP-surface
        # suite reads as uncovered and tanks the codecov patch/project gates.
        run: uv sync --frozen --no-default-groups --group dev --extra web

      - name: Coverage
        run: uv run make coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.14' }}
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          report_type: test_results
          files: ./test-results/*.xml
          use_oidc: true

  ci:
    name: ci (all jobs succeeded)
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pre-commit, docs, web, types, test, coverage]
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
