[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "c64cast"
version = "0.2.1"
# `description` and `keywords` mirror the GitHub repo's About blurb and topics.
# The About field is the source of truth — it is what people see first — so if
# either is reworded, change it there and here in the same commit. The blurb is
# longer than a typical PyPI summary and gets truncated in search listings;
# keeping one blurb in two places is worth more than the trim.
description = "Turn a real Commodore 64 into a programmable display + audio device via Ultimate 64 or TeensyROM+ — video, SID-music scopes, webcam, MIDI/ASID synth, WLED, generative visuals, overlays, playlists."
readme = "README.md"
requires-python = ">=3.11"   # tomllib is stdlib
license = "MIT"
license-files = ["LICENSE"]
authors = [
    # The noreply address already in the git history — keeps a personal
    # address out of published package metadata.
    { name = "Kelly Fox", email = "kfox@users.noreply.github.com" },
]
keywords = [
    "6502",
    "c64",
    "commodore-64",
    "demoscene",
    "petscii",
    "retrocomputing",
    "sid",
    "streaming",
    "teensyrom",
    "ultimate-64",
    "vic-ii",
    "wled",
]
# Each platform claimed here is backed two ways, and both halves are needed:
# a CI leg in the lint-and-test matrix (ubuntu × macos × windows) for the
# host-side code, since the suite mocks every U64/TeensyROM path, and regular
# real-hardware use for the pipeline the suite cannot cover. Adding a platform
# means adding both — keep this list and the CI matrix in sync.
#
# There is no "License :: OSI Approved :: MIT License" classifier on purpose —
# PEP 639 license expressions supersede license classifiers, and setuptools
# hard-errors if both are present.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video :: Display",
    "Typing :: Typed",
]

# DEPENDENCY PINNING POLICY. Everything here is a *bounded range*, never `==`.
# Published metadata is a constraint on the user's environment: an exact pin
# makes installing c64cast conflict with any env that already has numpy or
# opencv, which is most of them. Reproducibility comes from `uv.lock`, which
# still pins exact versions — so CI, `uv sync`, and the dev environment are
# byte-identical to before; only what we publish loosens.
#
# The shape is `>=known-good,<next-breaking`. The floor is the version we
# actually test against (so nobody resolves to something older than what CI
# proved works); the ceiling is the next release allowed to break us. For 1.0+
# projects that is the next major. For 0.x projects it depends on the project:
# ones that break in minors (sounddevice, mediapipe) get the next minor, while
# widely co-installed ones that don't (fastapi, uvicorn, zeroconf) get `<1` so
# we aren't the package that makes a user's env unsolvable.
#
# Hard dependencies — without these the package won't import.
# py65 is hard because the built-in WaveformScene depends on it for
# host-side SID register-state tracking (the U64's SID is real
# hardware: writes only, reads return 0, so we run a parallel py65
# 6502 to recover live $D4xx state). Pure Python, no C extension.
#
# The opencv pin binds only when no other opencv wheel is installed. Every
# variant (contrib, headless) unpacks to the same `site-packages/cv2/` under a
# different distribution name, so the installer treats them as unrelated and
# the last one written wins. `vision` pulls mediapipe, which requires
# opencv-contrib-python, so `[vision]` and `[all]` both resolve this pin and
# then load a different build. Not fixable from here — a conflict marker would
# make c64cast[all] unsolvable rather than make contrib go away — so
# `doctor._probe_opencv_provider` reports the build that actually loaded
# instead of leaving the divergence silent.
dependencies = [
    "numpy>=2.4.6,<3",
    "opencv-python>=5.0.0.93,<6",
    "py65>=1.2.0,<2",
    "requests>=2.34.2,<3",
]

[project.optional-dependencies]
# Mic capture (the 4-bit SID DAC streaming path).
mic = ["sounddevice>=0.5.5,<0.6"]
# Video playback uses PyAV for container demux + audio resampling.
video = ["av>=18.0.0,<19"]
# NOTE: there is deliberately no `preview` extra. The local preview window
# ([preview] enabled) and stream recording ([recording] enabled) both draw on
# cv2 — HighGUI for the window, VideoWriter for the file — and opencv-python is
# a hard dep, so both features are always available. The extra used to carry
# pygame purely as the window backend; it bought nothing cv2 didn't already
# provide, and its SDL window couldn't be created off the main thread anyway.
# FastAPI-based HTTP control plane (pause/resume/skip/reload).
control = ["fastapi>=0.140.0,<1", "uvicorn>=0.51.0,<1"]
# OBS Studio status overlay (websocket v5).
obs = ["obsws-python>=1.8.0,<2"]
# MIDI → SID scene (live MIDI input controls SID voices).
midi = ["mido>=1.3.3,<2", "python-rtmidi>=1.5.8,<2"]
# Pretty terminal logging (colored levels + timestamps). Falls back to
# plain logging.StreamHandler when not installed.
logging = ["rich>=15.0.0,<16"]
# TeensyROM+ hardware backend over USB serial (pyserial). The raw-TCP
# transport (port 2112) needs no extra dependency.
tr = ["pyserial>=3.5,<4"]
# Camera-as-input: webcam hand-gesture control (MediaPipe HandLandmarker).
# opencv/numpy are already hard deps; only mediapipe is extra. Needs a
# separately-downloaded .task model (see assets/models/README.md).
vision = ["mediapipe>=0.10.35,<1.1"]
# Interactive config builder (`c64cast --init`). questionary pulls in
# prompt_toolkit; both are small pure-Python deps.
wizard = ["questionary>=2.1.1,<3"]
# Select a webcam by name / USB VID:PID instead of a fragile cv2 index, and
# enrich `--list-devices` with camera names + VID:PID + the correct backend
# index. opencv/numpy are already hard deps; only the enumeration helper is
# extra. Integer indices keep working with this absent.
camera = ["cv2-enumerate-cameras>=1.3.3,<2"]
# URL playback for quick-playback mode (positional MEDIA args). yt-dlp resolves
# YouTube and other streaming sites to a directly-playable stream URL;
# direct media URLs play without it (PyAV opens http(s) natively).
# The one dependency with NO ceiling, deliberately: yt-dlp is network-facing
# and its site extractors break constantly, so security + functionality both
# depend on running a recent release. Its CalVer versioning has no "next
# breaking" number to bound against anyway. Floor is raised to the current
# known-good version to block a downgrade; the open ceiling lets `uv lock` pull
# fixes forward.
yt = ["yt-dlp>=2026.7.4"]
# WLED bridge Mode 1 (virtual WLED device / control surface): mDNS discovery
# (zeroconf) + the WLED JSON HTTP/WS API (fastapi + uvicorn, shared with the
# control plane). `websockets` is required here (not in `control`) because the
# WLED API's `/ws` endpoint is the primary "is it alive" channel WLED clients
# use — bare uvicorn has no ASGI websocket implementation, so `/ws` upgrades
# fail and clients report the device offline even though the JSON REST API
# works fine. Mode 3 (audio-sync broadcast) is pure stdlib and needs none of
# this.
wled = [
    "zeroconf>=0.150.0,<1",
    "fastapi>=0.140.0,<1",
    "uvicorn>=0.51.0,<1",
    "websockets>=16.1.1,<18",
]
# Everything optional, for users who want the full experience. Hand-maintained,
# so it must stay exactly the union of every other extra above —
# tests/test_packaging_metadata.py enforces that so it cannot silently drift.
all = [
    "av>=18.0.0,<19",
    "cv2-enumerate-cameras>=1.3.3,<2",
    "fastapi>=0.140.0,<1",
    "mediapipe>=0.10.35,<1.1",
    "mido>=1.3.3,<2",
    "obsws-python>=1.8.0,<2",
    "pyserial>=3.5,<4",
    "python-rtmidi>=1.5.8,<2",
    "questionary>=2.1.1,<3",
    "rich>=15.0.0,<16",
    "sounddevice>=0.5.5,<0.6",
    "uvicorn>=0.51.0,<1",
    "websockets>=16.1.1,<18",
    "yt-dlp>=2026.7.4",  # no ceiling on purpose — see the `yt` extra above
    "zeroconf>=0.150.0,<1",
]
[dependency-groups]
# Dev tools — not published to PyPI. Installed by default via
# [tool.uv] default-groups; CI pulls them with `--group dev`. Use the uv
# workflow (`uv sync --all-extras`) rather than `pip install -e .[dev]` —
# groups are not extras and can't be requested through `.[...]` syntax.
dev = [
    "ruff==0.16.1",
    "coverage==7.15.2",
    "mypy==2.3.0",
    "types-requests==2.33.0.20260712",
    "pyright==1.1.411",
    # Validates the generated JSON schema against the example configs in
    # tests/test_schema.py. Dev-only; the runtime never imports it.
    "jsonschema==4.26.0",
    # Required by fastapi.testclient (Starlette's TestClient) for the
    # control-plane end-to-end tests in tests/test_control_plane.py. FastAPI
    # declares it optional, so the `control` extra doesn't pull it; without it
    # those 13 tests skip. Dev-only; the runtime never imports it.
    "httpx==0.28.1",
    # Draws the reference guide's diagrams in scripts/make_reference_diagrams.py.
    # Already resolved transitively through matplotlib, but named here because
    # that script imports it directly. Dev-only; the runtime never imports it.
    "pillow==12.3.0",
    # JUnit XML reporter for the unittest suite (a unittest.TestRunner
    # subclass, NOT a different test framework). CI runs the suite through
    # `python -m xmlrunner discover` so Codecov Test Analytics can ingest the
    # results. Dev/CI-only; the runtime never imports it.
    "unittest-xml-reporting==4.0.0",
    # Parallel runner for the stdlib unittest suite (still stdlib unittest,
    # NOT a different framework). `make test` and the CI unit-test step run
    # the whole tree through `python -m unittest_parallel -s tests`, which
    # forks one process per test module (default `--level=module`, so each
    # module's shared state stays isolated in its own process). The suite is
    # ~75% blocked on socket timeouts / thread joins, so overlapping those
    # waits across cores cuts wall time ~3x (20s -> 7s on 16 cores) with
    # identical results. The `coverage` job stays on serial `xmlrunner`
    # because that path emits the JUnit XML that Codecov Test Analytics
    # ingests, which unittest_parallel doesn't produce. Dev/CI-only.
    "unittest-parallel==1.8.2",
]

[project.scripts]
c64cast = "c64cast.cli:main"

[project.urls]
Homepage = "https://github.com/kfox/c64cast"
# The documentation site: all three books plus the standalone user docs,
# rendered from the same Markdown by .github/workflows/pages.yml on every push
# to main. It is built from `main` rather than from the tag, which is the right
# trade for a link read off a PyPI page of any age -- a reader following it
# wants the current documentation, and every page says which branch it is.
Documentation = "https://kfox.github.io/c64cast/"
# Deliberately `releases/latest` rather than a pinned tag: this link is read
# from a PyPI page that may be any version's, and what a reader wants from it
# is the current release and its User's Guide PDF.
Releases = "https://github.com/kfox/c64cast/releases/latest"
Source = "https://github.com/kfox/c64cast"
Issues = "https://github.com/kfox/c64cast/issues"
Changelog = "https://github.com/kfox/c64cast/blob/main/CHANGELOG.md"
Videos = "https://www.youtube.com/@c64cast"

[tool.setuptools.packages.find]
where = ["."]
include = ["c64cast*"]

# The wheel ships only .py files unless files are listed here.
#
# `py.typed` is the PEP 561 marker that tells type checkers our annotations are
# real — without it consumers see an untyped package, even though we run
# `mypy --strict` on the state-bearing modules and pyright across the tree.
#
# `examples/` and `data/` are the reason those two trees live *under* the
# package rather than at the repo root: setuptools can only package files
# inside a package directory, and an installed user with no checkout still
# needs the demos (`--config example:NAME`, `--list-examples`) and the JSON
# schema the demos' `#:schema ../data/…` directive points at.
[tool.setuptools.package-data]
c64cast = ["py.typed", "data/*.json", "examples/*.toml", "examples/*/*.toml"]

# --- ruff ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
]
ignore = [
    "E501",  # line too long — we use 100 but defer to formatter
    "E731",  # lambda assignment — used intentionally in factories
    "B008",  # function call in default argument — argparse uses these
    "SIM117", # nested with: blocks read fine for resource-pair management
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]   # allow late imports inside test methods
"c64cast/overlays/__init__.py" = ["E402"]   # late-block re-export of backgrounds
"c64cast/scenes.py" = ["E741"]   # `l` for LAB-color split is canonical opencv idiom

# --- uv --------------------------------------------------------------------
[tool.uv]
default-groups = ["dev"]

# --- mypy ------------------------------------------------------------------
# Strict on the state-bearing modules where a type slip would corrupt state:
# the two backends' transports + clients (api/backend/teensyrom_api,
# socket_dma/teensyrom_dma), the playlist/scene/config state machines, the
# ensemble audio-slot coordinator, and the audio/dsp paths. The rest of the
# codebase is gradually-typed and would explode under --strict; modes.py
# especially mixes numpy with cv2 in ways that don't survive strict checking
# without heavy annotation noise. Run with `make typecheck`.
[tool.mypy]
python_version = "3.11"
files = [
    "c64cast/api.py",
    "c64cast/backend.py",
    "c64cast/teensyrom_api.py",
    "c64cast/audio.py",
    "c64cast/audio_handlers.py",
    "c64cast/playlist.py",
    "c64cast/socket_dma.py",
    "c64cast/teensyrom_dma.py",
    "c64cast/scenes.py",
    "c64cast/modes_irq.py",
    "c64cast/config.py",
    "c64cast/scene_factory.py",
    "c64cast/ensemble.py",
    "c64cast/dsp.py",
    "c64cast/quickcast.py",
    "c64cast/connect.py",
    "c64cast/transport.py",
]
strict = true
# Untyped helpers in the rest of the package are fine as-is; don't
# cascade strict-mode errors into them.
follow_imports = "silent"

[[tool.mypy.overrides]]
# Third-party libs without type stubs.
module = ["sounddevice", "av", "av.*",
          "uvicorn", "obsws_python", "mido", "py65", "py65.*",
          "serial", "serial.*"]
ignore_missing_imports = true

# --- pyright ---------------------------------------------------------------
# Basic mode matches Pylance's VS Code default so editor diagnostics align
# with CI. mypy --strict still polices the hot modules; pyright catches the
# broader Pylance-visible mistakes across the rest of the codebase + tests.
[tool.pyright]
include = ["c64cast", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"

# --- coverage --------------------------------------------------------------
[tool.coverage.run]
source = ["c64cast"]
branch = true
omit = [
    "tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "raise ImportError",
]
