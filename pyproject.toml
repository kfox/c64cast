[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "c64cast"
version = "0.4.0"
# Mirrors the GitHub repo's About blurb and topics, which are the source of
# truth: reword there and here in the same commit.
description = "Turn a real Commodore 64 into a programmable display + audio device via Ultimate 64 or TeensyROM+ — video, SID-music scopes, webcam, MIDI/ASID synth, WLED, generative visuals, overlays, playlists."
readme = "README.md"
requires-python = ">=3.11"   # tomllib is stdlib
license = "MIT"
license-files = ["LICENSE"]
authors = [
    # noreply, so a personal address stays out of published package metadata.
    { name = "Kelly Fox", email = "kfox@users.noreply.github.com" },
]
keywords = [
    "6502",
    "c64",
    "commodore-64",
    "demoscene",
    "petscii",
    "retrocomputing",
    "sid",
    "streaming",
    "teensyrom",
    "ultimate-64",
    "vic-ii",
    "wled",
]
# Keep the OS and Python classifiers in sync with ci.yml's `lint-and-test`
# matrix (ubuntu × macos × windows, py3.11-3.14).
#
# No "License :: OSI Approved :: MIT License" classifier: PEP 639 license
# expressions supersede license classifiers, and setuptools hard-errors if both
# are present.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video :: Display",
    "Typing :: Typed",
]

# Bounded ranges, never `==`: published metadata constrains the user's
# environment, and `uv.lock` is where the exact pins live. The shape is
# `>=known-good,<next-breaking` — the next major for 1.0+, the next minor for
# 0.x that breaks in minors (sounddevice, mediapipe), and `<1` for widely
# co-installed 0.x (fastapi, uvicorn, zeroconf), so this package is not the one
# that makes a user's environment unsolvable.
#
# Every opencv variant (contrib, headless) unpacks to the same
# `site-packages/cv2/` under a different distribution name, so the installer
# treats them as unrelated and the last one written wins: this pin still holds
# opencv-python's version, but not which build `import cv2` gets. `vision`
# pulls mediapipe, which requires opencv-contrib-python;
# `doctor._probe_opencv_provider` reports the build that actually loaded.
dependencies = [
    "numpy>=2.4.6,<3",
    "opencv-python>=5.0.0.93,<6",
    "py65>=1.2.0,<2",
    "requests>=2.34.2,<3",
]

[project.optional-dependencies]
mic = ["sounddevice>=0.5.5,<0.6"]
video = ["av>=18.0.0,<19"]
control = ["fastapi>=0.140.0,<1", "uvicorn>=0.51.0,<1"]
obs = ["obsws-python>=1.8.0,<2"]
midi = ["mido>=1.3.3,<2", "python-rtmidi>=1.5.8,<2"]
logging = ["rich>=15.0.0,<16"]
tr = ["pyserial>=3.5,<4"]
vision = ["mediapipe>=0.10.35,<1.1"]
wizard = ["questionary>=2.1.1,<3"]
camera = ["cv2-enumerate-cameras>=1.3.3,<2"]
# No ceiling: yt-dlp is network-facing, its site extractors break constantly,
# and CalVer offers no "next breaking" number to bound against. The floor
# blocks a downgrade.
yt = ["yt-dlp>=2026.7.4"]
# `websockets` is named explicitly: bare uvicorn ships no ASGI WebSocket
# implementation, so `/ws` upgrades fail and WLED clients report the device
# offline even though the JSON REST API works.
wled = [
    "zeroconf>=0.150.0,<1",
    "fastapi>=0.140.0,<1",
    "uvicorn>=0.51.0,<1",
    "websockets>=16.1.1,<18",
]
# `websockets` is named explicitly for the same reason as in `wled`: bare
# uvicorn ships no ASGI WebSocket implementation, so the upgrade fails and the
# console never updates. `zeroconf` is control/console_mdns.py's LAN
# advertisement — lazily imported and logged at DEBUG on ImportError, so a
# `web` install without it is simply not discoverable.
web = [
    "fastapi>=0.140.0,<1",
    "uvicorn>=0.51.0,<1",
    "websockets>=16.1.1,<18",
    "zeroconf>=0.150.0,<1",
]
# Hand-maintained, and must stay exactly the union of every other extra above
# — tests/test_packaging_metadata.py enforces it.
all = [
    "av>=18.0.0,<19",
    "cv2-enumerate-cameras>=1.3.3,<2",
    "fastapi>=0.140.0,<1",
    "mediapipe>=0.10.35,<1.1",
    "mido>=1.3.3,<2",
    "obsws-python>=1.8.0,<2",
    "pyserial>=3.5,<4",
    "python-rtmidi>=1.5.8,<2",
    "questionary>=2.1.1,<3",
    "rich>=15.0.0,<16",
    "sounddevice>=0.5.5,<0.6",
    "uvicorn>=0.51.0,<1",
    "websockets>=16.1.1,<18",
    "yt-dlp>=2026.7.4",  # no ceiling on purpose — see the `yt` extra above
    "zeroconf>=0.150.0,<1",
]
[dependency-groups]
dev = [
    "ruff==0.16.7",
    "coverage==7.16.0",
    "mypy==2.3.1",
    "types-requests==2.33.0.20260712",
    "pyright==1.1.414",
    "jsonschema==4.26.0",
    # fastapi.testclient (Starlette's TestClient) needs it, and FastAPI
    # declares it optional, so the `control` extra does not pull it.
    "httpx==0.28.1",
    # Satisfies the tests' `import mido` gate without the `midi` extra, whose
    # python-rtmidi has no wheels past cp312 and builds from a C++/meson sdist
    # needing the ALSA dev headers.
    "mido>=1.3.3,<2",
    "pillow==12.3.0",
    # A unittest.TestRunner subclass, not a second test framework: CI runs the
    # suite through it for the JUnit XML Codecov Test Analytics ingests.
    "unittest-xml-reporting==4.0.0",
    # A parallel runner for the stdlib unittest suite, not a second test
    # framework: one forked process per test module.
    "unittest-parallel==1.8.6",
]

[project.scripts]
c64cast = "c64cast.app.cli:run"

[project.urls]
Homepage = "https://github.com/kfox/c64cast"
Documentation = "https://kfox.github.io/c64cast/"
Releases = "https://github.com/kfox/c64cast/releases/latest"
Source = "https://github.com/kfox/c64cast"
Issues = "https://github.com/kfox/c64cast/issues"
Changelog = "https://github.com/kfox/c64cast/blob/main/CHANGELOG.md"
Videos = "https://www.youtube.com/@c64cast"

[tool.setuptools.packages.find]
where = ["."]
include = ["c64cast*"]

[tool.setuptools.package-data]
c64cast = [
    "py.typed",
    "control/*.html",
    # Spliced into both control pages at render time (control/page_assets.py),
    # so it ships even though nothing serves it as a file of its own.
    "control/*.js",
    "wled/*.html",
    "data/*.json",
    "examples/*.toml",
    "examples/*/*.toml",
    "web/dist/*",
    "web/dist/assets/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# Format-only, unlike `extend-exclude`: ruff reflows fenced Python inside
# Markdown, and the books' samples are hand-wrapped for narrower PDF columns.
[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
]
ignore = [
    "E501",  # line length is the formatter's job
    "E731",  # lambda assignment — factories
    "B008",  # function call in default argument — argparse
    "SIM117", # nested with — resource pairs
]

# `annotationlib` is stdlib as of 3.14, but ruff classifies imports by
# `target-version` — py311 here — and would file it as third-party.
[tool.ruff.lint.isort]
extra-standard-library = ["annotationlib"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]   # allow late imports inside test methods
"c64cast/scenes/overlays/__init__.py" = ["E402"]   # late-block re-export of backgrounds
"c64cast/scenes/generators/__init__.py" = ["E402"]   # ordered submodule imports after the base class
"c64cast/scenes/scenes.py" = ["E741"]   # `l` for LAB-color split is canonical opencv idiom

[tool.uv]
default-groups = ["dev"]

[tool.mypy]
python_version = "3.11"
files = [
    "c64cast/hw/api.py",
    "c64cast/hw/backend.py",
    "c64cast/hw/teensyrom_api.py",
    "c64cast/audio/audio.py",
    "c64cast/audio/audio_rate.py",
    "c64cast/audio/audio_handlers.py",
    "c64cast/app/playlist.py",
    "c64cast/app/session.py",
    "c64cast/app/serve.py",
    "c64cast/app/config_store.py",
    "c64cast/app/console_library.py",
    "c64cast/hw/socket_dma.py",
    "c64cast/hw/teensyrom_dma.py",
    "c64cast/scenes/scenes.py",
    "c64cast/video/modes_irq.py",
    "c64cast/app/config.py",
    "c64cast/app/scene_factory.py",
    "c64cast/app/ensemble.py",
    "c64cast/audio/dsp.py",
    "c64cast/app/quickcast.py",
    "c64cast/app/connect.py",
    "c64cast/control/transport.py",
]
strict = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["sounddevice", "av", "av.*",
          "uvicorn", "obsws_python", "mido", "py65", "py65.*",
          "serial", "serial.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["c64cast", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"

[tool.coverage.run]
source = ["c64cast"]
branch = true
omit = [
    "tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "raise ImportError",
]
