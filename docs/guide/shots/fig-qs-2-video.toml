#:schema ../../../c64cast.schema.json
# fig-qs-2-video — video through the default multicolour hi-res mode.
#
# `start_s` seeks to a shot worth showing instead of leaving the timing to
# however long the app took to boot. mhires is what quick playback
# (`c64cast clip.mp4`) picks for video anyway; it is set explicitly here
# because a config, unlike quick playback, has no such default.
#
# `file` is not in the checkout (assets/ is git-ignored), and `start_s` is
# meaningless against a different clip. Substitute your own and re-seek: what
# the figure wants is a frame with saturated colour and a recognisable subject,
# since mhires is being shown off. A washed-out frame makes the mode look worse
# than it is.

[[scenes]]
type = "video"
file = "assets/videos/Commodore VIC-20 ad with William Shatner [UK9VU1aJvTI].webm"
display = "mhires"
start_s = 8.0
name = "Shatner"
