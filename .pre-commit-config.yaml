exclude: '^(docs/shared/fonts/(?!README\.md)|c64cast/web/dist/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
        exclude: '^docs/(guide/img|shared/fonts)/'
      - id: check-added-large-files
        name: check for added large files (guide figures)
        args: ["--maxkb=2048"]
        files: '^docs/guide/img/'
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep on the same version as uv.lock's ruff; bump both together.
    rev: v0.15.17
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        pass_filenames: false
        types: [python]
      - id: unittest
        name: unittest
        entry: scripts/pre-commit.sh
        language: system
        pass_filenames: false
        types: [python]
