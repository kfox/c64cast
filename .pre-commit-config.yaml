exclude: '^(docs/shared/fonts/(?!README\.md)|c64cast/web/dist/)'

default_install_hook_types: [pre-commit, commit-msg]
# Without this, a hook that does not restrict `stages` also runs at commit-msg,
# against the message file: `mixed-line-ending --fix=lf` rewrites it and fails.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
        exclude: '^docs/(guide/img|shared/fonts)/'
      - id: check-added-large-files
        name: check for added large files (guide figures)
        args: ["--maxkb=2048"]
        files: '^docs/guide/img/'
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-dependabot

  # A hook added here must not re-pin a tool pyproject pins —
  # tests/test_tooling_pins.py enforces it.
  - repo: local
    hooks:
      - id: venv-matches-checkout
        name: venv matches this checkout
        entry: scripts/check_venv_target.py
        language: system
        pass_filenames: false
        always_run: true
      - id: commit-message-shape
        name: commit message shape
        entry: uv run --locked python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
      - id: lint-comments
        name: comments this commit adds
        entry: uv run --locked python scripts/lint_comments.py
        language: system
        types_or: [python, pyi]
      - id: ruff
        name: ruff
        entry: uv run --locked ruff check --fix --force-exclude
        language: system
        require_serial: true
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        require_serial: true
        types_or: [python, pyi, jupyter]
      - id: pyright
        name: pyright
        entry: uv run --locked pyright
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: unittest
        name: unittest
        entry: uv run --locked scripts/pre-commit.sh
        language: system
        pass_filenames: false
        types_or: [python, pyi]
