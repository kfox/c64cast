exclude: '^(docs/shared/fonts/(?!README\.md)|c64cast/web/dist/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
        exclude: '^docs/(guide/img|shared/fonts)/'
      - id: check-added-large-files
        name: check for added large files (guide figures)
        args: ["--maxkb=2048"]
        files: '^docs/guide/img/'
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # A hook added here must not re-pin a tool pyproject pins —
  # tests/test_tooling_pins.py enforces it.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --locked ruff check --fix --force-exclude
        language: system
        require_serial: true
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        require_serial: true
        types_or: [python, pyi, jupyter]
      - id: pyright
        name: pyright
        entry: uv run --locked pyright
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: unittest
        name: unittest
        entry: uv run --locked scripts/pre-commit.sh
        language: system
        pass_filenames: false
        types_or: [python, pyi]
