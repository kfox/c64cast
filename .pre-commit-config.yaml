# Pre-commit hooks. Install with:
#   uv tool install pre-commit
#   pre-commit install
#
# Run manually against all files with:
#   pre-commit run --all-files
#
# These same hooks are enforced in CI (.github/workflows/ci.yml, "pre-commit"
# job — which runs the hooks through `uvx pre-commit` and skips the
# pyright/unittest ones, since the lint-and-test job already runs those across
# the OS × Python matrix).
#
# NOTE: the ruff-pre-commit rev below pins the SAME ruff version as uv.lock
# (and therefore `make lint` / `make fmt`). Keep the two in sync — bump this
# rev whenever you `uv lock --upgrade-package ruff`, or formatting will differ
# between local `make fmt` and the pre-commit/CI check.

# docs/shared/fonts/ holds third-party OFL fonts and their licence texts,
# vendored byte-for-byte from upstream. The whitespace fixers happily rewrite
# a licence file, which is not ours to reformat. Its README is ours, so that
# one stays in.
exclude: '^docs/shared/fonts/(?!README\.md)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
        exclude: '^docs/(guide/img|shared/fonts)/'
      # The guide's figures are print-resolution captures off a C64's HDMI
      # output. The signal carries enough sampling noise that a nominally
      # 16-colour screen arrives with thousands of distinct values, so they
      # neither palettize nor compress anywhere near the general limit. They
      # still get a ceiling, just a realistic one.
      - id: check-added-large-files
        name: check for added large files (guide figures)
        args: ["--maxkb=2048"]
        files: '^docs/guide/img/'
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        pass_filenames: false
        types: [python]
      - id: unittest
        name: unittest
        entry: scripts/pre-commit.sh
        language: system
        pass_filenames: false
        types: [python]
