#:schema ../data/c64cast.schema.json
# Single-scene demo: multicolor-bitmap spectrum analyzer over a generative
# plasma, driven by live audio input.
#
# `spectrum_bitmap` is the bitmap-native sibling of `spectrum_petscii`. Instead
# of filling character cells in a 40x25 grid it paints straight into the mhires
# 160x200 multicolor bitmap, so a bar's height is a pixel rather than a row —
# 200 levels instead of 25, and bar tops land mid-cell. It only runs on
# `display = "mhires"` (it is written against that mode's buffer set).
#
# Where the bars come from: the scene's music features, not a private FFT. Any
# reactive scene works —
#   audio_source = "mic"   live input, analyzed pre-DSP (this file)
#   audio_source = "file"  a decoded track, same analyzer
#   audio_source = "sid"   a .sid tune, bars synthesized from the gated voices
# The overlay reads whichever the scene provides, so it needs no [audio] of its
# own on the SID path.
#
# SID + mhires caveat: a SID audio source cannot relocate the display, so the
# tune's payload must clear BOTH $0400 and the $2000 bitmap. Most HVSC tunes
# load at $1000 and are refused with an actionable error — use a char display
# (mcm/petscii) with `spectrum_petscii` for those, or a tune loading above
# $3F40 for this one.
#
# Requires the `mic` extra: `pip install -e .[mic]`.
#
# Run:
#   c64cast --config example:overlay-spectrum_bitmap

[ultimate64]
url = "http://192.168.2.64"

[audio]
enabled = true
# device = 1                          # input device index (else system default)
# mic_sensitivity = 1.5               # raise for a quiet feed

[playlist]
interleave_videos = false

[[scenes]]
type = "generative"
name = "spectrum_bitmap demo"
source = "plasma"
display = "mhires"
audio_source = "mic"
reactive = true                       # feeds the overlay AND the visuals
duration_s = 120.0

  [[scenes.overlays]]
  type = "spectrum_bitmap"
  placement = "bottom"                # bottom | center | split
  height_frac = 0.5                   # fraction of screen height at full energy
  gain = 1.0
