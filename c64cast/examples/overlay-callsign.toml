#:schema ../data/c64cast.schema.json
# Single-scene demo: PETSCII webcam + callsign overlay.
#
# Static text in a corner — paints once, then change-detects so it
# emits zero traffic for the rest of the run.
#
# Run:
#   c64cast --config example:overlay-callsign

[ultimate64]
url = "http://192.168.2.64"

[video]
device = -1

[playlist]
interleave_videos = false

[[scenes]]
type = "webcam"
display = "petscii"
name = "callsign demo"

  [[scenes.overlays]]
  type = "callsign"
  text = "DE C64"
  corner = "bottom-right"
  fg_color = "light blue"
