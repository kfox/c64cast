#:schema ../data/c64cast.schema.json
# Single-scene demo: the C64 as a virtual WLED LED matrix (WLED bridge Mode 2).
#
# A `wled` scene turns the C64 into a network pixel sink: any WLED-ecosystem
# realtime pixel sender on the LAN (LedFx / xLights / another WLED syncing)
# streams frames to this host over UDP, and the display mode quantizes each
# received frame to the C64 — it's just another video source behind the same
# seam a webcam/video/generator uses. Two protocols are accepted, auto-detected,
# on their standard ports: DDP (4048) and WLED realtime UDP (21324). No sender
# on hand? Drive it with scripts/diags/wled_pixel_sender.py.
#
# `sink_width`/`sink_height` are the virtual matrix the sender targets — set
# them to match the sender's configured pixel layout. No audio, no SID.
#
# Neither wire protocol authenticates its sender, so this is trusted-segment
# only: anyone who can reach the bound ports controls what's on screen.
# `sink_allow` restricts accepted senders to an IP allowlist (empty accepts
# any sender, matching real WLED's own behavior); `sink_ddp_port` /
# `sink_wled_port` move the sink off the two standard ports if something
# else on this host already owns one.
#
# This is the OTHER direction from wled-control.toml (Mode 1, where c64cast
# presents itself as a virtual WLED device the WLED app can discover and
# control). The WLED app is a *controller* and can't stream pixels, so it
# can't drive this scene — see wled-control.toml for that use case instead.
#
# Run:
#   c64cast --config example:scene-wled
# Then point a sender at this host, e.g.:
#   scripts/diags/wled_pixel_sender.py --host <this-host> --protocol ddp

[ultimate64]
url = "http://192.168.2.64"

[playlist]
interleave_videos = false

[[scenes]]
type = "wled"
name = "WLED sink (mhires)"
display = "mhires"
sink_width = 320
sink_height = 200
duration_s = 0.0     # run forever (the sink has no natural end)
# sink_allow = ["192.168.2.10"]   # restrict senders to this LAN allowlist
# sink_ddp_port = 4048            # override if something else owns 4048
# sink_wled_port = 21324          # override if something else owns 21324
